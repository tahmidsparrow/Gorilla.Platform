name: gorilla

networks:
  gorilla:

volumes:
  mysql_data:
  hr_uploads:
  ats_uploads:

services:
  mysql:
    image: mysql:9
    networks: [gorilla]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GORILLAHR_DB_PASSWORD: ${GORILLAHR_DB_PASSWORD}
      RECRUITMENT_DB_PASSWORD: ${RECRUITMENT_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # No `ports:` — only the gateway is reachable from the host.

  # One-shot: waits for MySQL, runs `alembic upgrade head`, seeds baseline data,
  # then exits 0. hr-api waits for it to succeed rather than migrating on its own
  # boot, so scaling hr-api to >1 replica later never races a schema migration.
  #
  # The image's own docker-entrypoint.sh does all three steps and then execs its
  # command, so the command is just a no-op that makes the container exit. Do not
  # override `entrypoint:` with a bare `alembic` here: that skips both the DB wait
  # and `python -m app.seed`, and since hr-api runs with RUN_MIGRATIONS=0 nothing
  # else would ever seed — leaving a schema with no roles, so no one can log in.
  hr-migrate:
    build:
      context: ../../GorillaHR/backend
    networks: [gorilla]
    environment:
      DATABASE_URL: mysql+pymysql://gorillahr_app:${GORILLAHR_DB_PASSWORD}@mysql:3306/gorillahr
    command: ["echo", "[hr-migrate] migrate + seed complete"]
    depends_on:
      mysql:
        condition: service_healthy

  hr-api:
    build:
      context: ../../GorillaHR/backend
    networks: [gorilla]
    environment:
      DATABASE_URL: mysql+pymysql://gorillahr_app:${GORILLAHR_DB_PASSWORD}@mysql:3306/gorillahr
      SECRET_KEY: ${HR_SECRET_KEY}
      CORS_ORIGINS: ""
      UPLOAD_DIR: uploads
      # hr-migrate already ran the upgrade and seed; repeating them on every API
      # boot races that job and caps this service at one replica.
      RUN_MIGRATIONS: "0"
      # Uvicorn's CLI is declared auto_envvar_prefix="UVICORN", so this becomes
      # --root-path /hr, letting FastAPI's /docs and /openapi.json resolve behind
      # the gateway. Deliberately env, not app config: export_openapi.py must keep
      # emitting an unprefixed spec.
      UVICORN_ROOT_PATH: /hr
    volumes:
      - hr_uploads:/app/uploads
    depends_on:
      hr-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No `ports:` — only the gateway is reachable from the host.

  hr-web:
    build:
      context: ../../GorillaHR/frontend
      args:
        # GorillaHR's image defaults to its own standalone deployment (base "/",
        # backend named "backend"). Both are baked in at build time, so they have
        # to be passed here rather than set as runtime environment.
        #
        # API_UPSTREAM is not cosmetic: nginx resolves proxy_pass hostnames when
        # it loads its config, so the default "backend" — a name that does not
        # exist on this network — stops the container from starting at all.
        VITE_BASE: /hr/
        API_UPSTREAM: hr-api:8000
    networks: [gorilla]
    depends_on:
      hr-api:
        condition: service_started
    restart: unless-stopped

  ats-api:
    build:
      context: ../../Recruitment.Gorilla/server
    networks: [gorilla]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        server=mysql;port=3306;database=RecruitmentGorilla;
        user=recruitment_app;password=${RECRUITMENT_DB_PASSWORD}
      Jwt__Key: ${ATS_JWT_KEY}
      Jwt__Issuer: RecruitmentGorilla
      Jwt__Audience: RecruitmentGorilla
      Auth__SeedAdminEmail: ${ATS_SEED_ADMIN_EMAIL}
      Auth__PasswordHash: ${ATS_SEED_ADMIN_PASSWORD_HASH}
      # AllowedOrigins is intentionally not set here: ASPNETCORE_ENVIRONMENT=Production
      # means appsettings.json's base "AllowedOrigins": [] applies, and a later env-var
      # layer cannot truncate an array from an earlier layer — only appsettings.Development.json
      # (not loaded in Production) carries real origins. See appsettings.json / .Development.json.
    volumes:
      - ats_uploads:/app/Uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # No `ports:` — only the gateway is reachable from the host. Honors RG's
    # loopback-only golden rule at the network layer (see AGENTS.md rule 2).

  ats-web:
    build:
      context: ../../Recruitment.Gorilla/client
    networks: [gorilla]
    depends_on:
      ats-api:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    networks: [gorilla]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    depends_on:
      hr-api: { condition: service_started }
      hr-web: { condition: service_started }
      ats-api: { condition: service_started }
      ats-web: { condition: service_started }
    restart: unless-stopped
