map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name gorilla.test;

    # nginx defaults to 1m — CV PDFs, requisition attachments and profile
    # images all exceed it and fail with an opaque 413. Must be raised.
    client_max_body_size 25m;

    # /id/* is added in P1, once the identity service exists. Adding it now
    # would stop nginx starting at all: it resolves proxy_pass upstream
    # hostnames at config-load time and exits if one doesn't resolve.

    location /hr/api/    { proxy_pass http://hr-api:8000/api/;     include /etc/nginx/proxy_common.conf; }
    location /hr/uploads/{ proxy_pass http://hr-api:8000/uploads/; include /etc/nginx/proxy_common.conf; }
    location /hr/        { proxy_pass http://hr-web/;              include /etc/nginx/proxy_common.conf; }

    location /ats/api/   { proxy_pass http://ats-api:8080/api/; include /etc/nginx/proxy_common.conf; }
    location /ats/       { proxy_pass http://ats-web/;          include /etc/nginx/proxy_common.conf; }

    location = / {
        return 302 /hr/;
    }
}
